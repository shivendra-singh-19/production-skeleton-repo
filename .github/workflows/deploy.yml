name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 801969732023.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: prod/production-skeleton-repo
  EC2_INSTANCE_ID: i-0c45cbc8cc90c4afa

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # 1. Checkout source code
      # ----------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------
      # 2. Configure AWS using GitHub OIDC
      # ----------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::801969732023:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------
      # 3. Login to ECR
      # ----------------------------------------
      - name: Login to ECR
        run: |
          aws ecr get-login-password \
            --region "$AWS_REGION" | \
          docker login \
            --username AWS \
            --password-stdin "$ECR_REGISTRY"

      # ----------------------------------------
      # 4. Build Docker image
      # ----------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}" \
            .

      # ----------------------------------------
      # 5. Push image to ECR
      # ----------------------------------------
      - name: Push Docker image
        run: |
          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"

      # ----------------------------------------
      # 6. Deploy image to EC2 through SSM
      # ----------------------------------------
      - name: Deploy to EC2
        run: |

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"

          echo "Deploying image:"
          echo "$IMAGE"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"sudo -iu ubuntu bash -c 'aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY && docker pull $IMAGE && ~/containers/app.sh $IMAGE'\"
            ]" \
            --comment "Deploy skeleton backend $GITHUB_SHA" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # ----------------------------------------
          # 7. Poll SSM instead of using waiter
          # ----------------------------------------
          echo "Waiting for deployment..."

          for i in {1..60}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment successful!"
                break
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed with status: $STATUS"

                echo "----- STDOUT -----"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text

                echo "----- STDERR -----"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text

                exit 1
                ;;

              *)
                sleep 5
                ;;
            esac

          done

          # ----------------------------------------
          # 8. Make sure we didn't timeout polling
          # ----------------------------------------
          FINAL_STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" \
            --output text)

          if [ "$FINAL_STATUS" != "Success" ]; then
            echo "Deployment did not complete successfully."
            echo "Final status: $FINAL_STATUS"

            echo "----- STDOUT -----"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "StandardOutputContent" \
              --output text

            echo "----- STDERR -----"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "StandardErrorContent" \
              --output text

            exit 1
          fi

          echo "Deployment completed successfully."