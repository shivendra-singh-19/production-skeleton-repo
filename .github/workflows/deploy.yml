name: Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::801969732023:role/GitHubActionsDeployRole
          aws-region: ap-south-1

      - name: Test AWS access
        run: |
          aws sts get-caller-identity

      - name: Test SSM
        run: |
          aws ssm send-command \
            --instance-ids i-0c45cbc8cc90c4afa \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["whoami","docker --version","pwd"]'