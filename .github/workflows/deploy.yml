name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::801969732023:role/GitHubActionsDeployRole
          aws-region: ap-south-1

      - name: Deploy to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0c45cbc8cc90c4afa" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "sudo -iu ubuntu bash -c '\''cd ~/projects/production-skeleton-repo && ./build.sh && docker stop app || true && docker rm -f app || true && ~/containers/app.sh'\''"
            ]' \
            --comment "Deploy skeleton backend" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-YOUR_INSTANCE_ID"

          echo "Deployment output:"
          
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-YOUR_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-YOUR_INSTANCE_ID" \
            --query "Status" \
            --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed with status: $STATUS"
            exit 1
          fi